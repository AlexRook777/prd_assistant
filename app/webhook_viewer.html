<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Viewer</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-color: #58a6ff;
            --success-color: #238636;
            --danger-color: #da3633;
            --code-bg: #0d1117;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        button {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            border-color: var(--text-secondary);
            background-color: #21262d;
        }

        button.primary {
            background-color: var(--success-color);
            border-color: rgba(240, 246, 252, 0.1);
            color: white;
        }

        button.primary:hover {
            background-color: #2ea043;
        }

        button.danger {
            color: var(--danger-color);
            border-color: rgba(218, 54, 51, 0.4);
        }

        button.danger:hover {
            background-color: rgba(218, 54, 51, 0.1);
        }

        .polling-indicator {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .polling-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }

            100% {
                opacity: 1;
            }
        }

        #webhook-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .webhook-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .webhook-header {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.02);
        }

        .webhook-header:hover {
            background-color: rgba(255, 255, 255, 0.04);
        }

        .webhook-meta {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .method-badge {
            background-color: var(--accent-color);
            color: #0d1117;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .timestamp {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-family: monospace;
        }

        .webhook-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm {
            padding: 0.2rem 0.6rem;
            font-size: 0.8rem;
        }

        .webhook-details {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .webhook-details.open {
            display: block;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            margin-top: 1rem;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        pre {
            background-color: var(--code-bg);
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
            background-color: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
        }

        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            margin-left: -125px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 2px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            font-size: 17px;
        }

        #toast.show {
            visibility: visible;
            -webkit-animation: fadein 0.5s, fadeout 0.5s 2.5s;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein {
            from {
                bottom: 0;
                opacity: 0;
            }

            to {
                bottom: 30px;
                opacity: 1;
            }
        }

        @keyframes fadeout {
            from {
                bottom: 30px;
                opacity: 1;
            }

            to {
                bottom: 0;
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>Webhook Viewer</h1>
            <div class="controls">
                <div class="polling-indicator">
                    <div class="polling-dot"></div>
                    Live Polling usually (5s)
                </div>
                <button onclick="fetchWebhooks()" class="primary">
                    Refresh
                </button>
                <button onclick="clearWebhooks()" class="danger">
                    Clear Logs
                </button>
            </div>
        </header>

        <div id="webhook-list">
            <!-- Webhooks will be inserted here -->
        </div>
    </div>

    <div id="toast">Copied to clipboard!</div>

    <script>
        const API_URL = '/api/webhooks';
        let lastWebhooks = [];

        async function fetchWebhooks() {
            try {
                const response = await fetch(API_URL);
                const webhooks = await response.json();

                // Only update DOM if checks differ
                if (JSON.stringify(webhooks) !== JSON.stringify(lastWebhooks)) {
                    renderWebhooks(webhooks);
                    lastWebhooks = webhooks;
                }
            } catch (error) {
                console.error('Error fetching webhooks:', error);
            }
        }

        async function clearWebhooks() {
            if (!confirm('Are you sure you want to clear all webhook logs?')) return;

            try {
                await fetch(API_URL, { method: 'DELETE' });
                fetchWebhooks();
                showToast("Webhooks cleared");
            } catch (error) {
                console.error('Error clearing webhooks:', error);
            }
        }

        function renderWebhooks(webhooks) {
            const list = document.getElementById('webhook-list');
            list.innerHTML = '';

            if (webhooks.length === 0) {
                list.innerHTML = `
                <div class="empty-state">
                    <h3>No webhooks received yet</h3>
                    <p>Send a POST request to /webhook to see it appear here.</p>
                </div>
            `;
                return;
            }

            // Sort by timestamp descending (newest first)
            webhooks.reverse().forEach((webhook, index) => {
                const card = document.createElement('div');
                card.className = 'webhook-card';

                const date = new Date(webhook.timestamp);
                const formattedTime = date.toLocaleString();
                const bodyString = JSON.stringify(webhook.body, null, 2);

                card.innerHTML = `
                <div class="webhook-header" onclick="toggleDetails(${index})">
                    <div class="webhook-meta">
                        <span class="method-badge">${webhook.method}</span>
                        <span class="timestamp">${formattedTime}</span>
                    </div>
                    <div class="webhook-actions">
                        <button class="btn-sm" onclick="event.stopPropagation(); copyToClipboard('${escapeJsString(bodyString)}')">Copy Body</button>
                    </div>
                </div>
                <div class="webhook-details" id="details-${index}">
                    <div class="section-title">Headers</div>
                    <pre>${JSON.stringify(webhook.headers, null, 2)}</pre>
                    
                    <div class="section-title">Body</div>
                    <pre>${bodyString}</pre>
                </div>
            `;
                list.appendChild(card);
            });
        }

        function toggleDetails(index) {
            const el = document.getElementById(`details-${index}`);
            el.classList.toggle('open');
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("Copied to clipboard!");
            });
        }

        function escapeJsString(str) {
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "show";
            setTimeout(function () { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // Initial fetch
        fetchWebhooks();

        // Poll every 5 seconds
        setInterval(fetchWebhooks, 5000);
    </script>

</body>

</html>
