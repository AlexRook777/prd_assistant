<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFastPay Ecuador HPP - Test Console</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        :root {
            --primary: #00ff88;
            --primary-dark: #00cc6e;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --error: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.3;
            padding: 0.5rem;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            max-width: 100%;
            height: calc(100vh - 1rem);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto 1fr;
            gap: 0.5rem;
        }

        h1 {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow-y: auto;
            height: 100%;
        }

        .form-group {
            margin-bottom: 0.75rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 0.25rem;
        }

        .required::after {
            content: " *";
            color: var(--error);
        }

        input,
        select,
        textarea {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.4rem 0.6rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.8rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        button {
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .log-container,
        .webhook-container {
            flex: 1;
            overflow-y: auto;
            background-color: #0c111d;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.7rem;
        }

        .log-entry,
        .webhook-entry {
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #1e293b;
        }

        .log-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-dim);
            margin-bottom: 0.25rem;
        }

        .status-badge {
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 700;
        }

        .status-success {
            background-color: var(--success);
            color: #fff;
        }

        .status-failed {
            background-color: var(--error);
            color: #fff;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-all;
            color: #e2e8f0;
            background: #1e293b;
            padding: 0.4rem;
            border-radius: 4px;
            margin-top: 0.25rem;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.65rem;
            padding: 0;
            text-decoration: underline;
            margin-top: 0.25rem;
        }

        .logs-webhooks-column {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            height: 100%;
            overflow: hidden;
        }

        .logs-section,
        .webhooks-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary);
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #334155;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--primary);
        }

        input:checked+.slider:before {
            transform: translateX(14px);
        }

        #payment-link-container {
            margin-top: 0.5rem;
            padding: 0.5rem;
            background-color: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--primary);
            border-radius: 6px;
            display: none;
            font-size: 0.8rem;
        }

        #payment-link-container a {
            color: var(--primary);
            word-break: break-all;
        }

        .loading-spinner {
            width: 0.8rem;
            height: 0.8rem;
            border: 2px solid rgba(15, 23, 42, 0.3);
            border-top-color: #0f172a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>SmartFastPay Ecuador HPP - Test Console</h1>

        <!-- Column 1: Credentials & Configuration -->
        <div class="card">
            <div class="section-header">
                <h2 class="section-title">API Credentials</h2>
                <div class="switch-container">
                    <span id="proxy-label">Proxy</span>
                    <label class="switch">
                        <input type="checkbox" id="use-proxy-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label for="client-id" class="required">Client ID</label>
                <input type="text" id="client-id" value="fd8111f7-6ace-4789-b05a-40a6a36cb0be">
            </div>
            <div class="form-group">
                <label for="client-secret" class="required">Client Secret</label>
                <input type="password" id="client-secret" value="nST8TYE78oANwe6dvhMiCQQZfthIoWlG">
            </div>

            <div
                style="display: grid; grid-template-columns: auto 1fr; gap: 0.5rem; align-items: start; margin-bottom: 1rem;">
                <button id="btn-get-token">Get Token</button>
                <div class="form-group" style="margin: 0;">
                    <label for="access-token">Access Token</label>
                    <textarea id="access-token" rows="2" readonly placeholder="Token will appear here..."></textarea>
                </div>
            </div>

            <div class="section-header" style="margin-top: 1rem;">
                <h2 class="section-title">Webhook Configuration</h2>
                <div class="switch-container">
                    <span id="webhook-label">N8n Webhooks</span>
                    <label class="switch">
                        <input type="checkbox" id="use-webhook-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label for="order-id">Merchant Order ID (Auto-generated)</label>
                <input type="text" id="order-id" readonly>
            </div>
            <div class="form-group">
                <label for="webhook-url">Webhook URL</label>
                <input type="text" id="webhook-url" readonly>
            </div>
        </div>

        <!-- Column 2: Create Transaction -->
        <div class="card">
            <h2 class="section-title">Create Transaction</h2>

            <div class="form-row">
                <div class="form-group">
                    <label for="tx-amount" class="required">Amount</label>
                    <input type="number" id="tx-amount" step="0.01" value="10.00">
                </div>
                <div class="form-group">
                    <label for="tx-currency" class="required">Currency</label>
                    <input type="text" id="tx-currency" value="USD">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tx-country" class="required">Country</label>
                    <input type="text" id="tx-country" value="ECU">
                </div>
                <div class="form-group">
                    <label for="tx-id" class="required">Provider Transaction ID</label>
                    <input type="text" id="tx-id" readonly placeholder="Generated after request">
                </div>
            </div>

            <div class="form-group">
                <label for="cust-name" class="required">Customer Name</label>
                <input type="text" id="cust-name" value="Test User ECU">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cust-id" class="required">Document Number (ECU ID)</label>
                    <input type="text" id="cust-id" value="1701234567">
                </div>
                <div class="form-group">
                    <label for="cust-id-type" class="required">Document Type</label>
                    <input type="text" id="cust-id-type" value="CC">
                </div>
            </div>

            <div class="form-group">
                <label for="cust-email">Customer Email (Optional)</label>
                <input type="email" id="cust-email" value="test@example.com">
            </div>

            <div class="form-group">
                <label for="redirect-url">Redirect URL (Optional)</label>
                <input type="text" id="redirect-url" value="https://google.com">
            </div>

            <button id="btn-create-tx" style="width: 100%;">Create Transaction</button>

            <div id="payment-link-container">
                <strong>Payment Link:</strong><br>
                <a id="payment-link" href="#" target="_blank">Pending...</a>
                <div class="button-group">
                    <button id="btn-check-status" class="secondary" style="flex: 1;">Check Status</button>
                    <button id="btn-open-link" style="flex: 1;">Open Link</button>
                </div>
                <div style="margin-top: 0.5rem; font-size: 0.75rem;">
                    <strong>Status:</strong> <span id="payment-status">Not Checked</span>
                </div>
            </div>
        </div>

        <!-- Column 3: Logs & Webhooks -->
        <div class="logs-webhooks-column">
            <div class="logs-section">
                <div class="section-header">
                    <h3 class="section-title">API Logs</h3>
                    <button class="copy-btn" id="btn-clear-logs">Clear</button>
                </div>
                <div id="api-logs" class="log-container"></div>
            </div>

            <div class="webhooks-section">
                <div class="section-header">
                    <h3 class="section-title">Webhooks</h3>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="copy-btn" id="btn-refresh-webhooks">Refresh</button>
                        <button class="copy-btn" id="btn-clear-webhooks">Clear</button>
                    </div>
                </div>
                <div id="webhook-logs" class="webhook-container"></div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            PROXY_URL: 'http://localhost:8000/proxy',
            LOCAL_WEBHOOK: 'http://localhost:8000/webhook',
            LOCAL_POLL: 'http://localhost:8000/api/webhooks',
            N8N_BASE: 'https://n8n.4bill.io/webhook/0154f998-9882-4b6b-b08b-a3a9e6e3d38b'
        };

        const state = {
            token: null,
            orderId: null,
            providerTxId: null,
            pollingInterval: null
        };

        // UI Elements
        const el = {
            clientId: document.getElementById('client-id'),
            clientSecret: document.getElementById('client-secret'),
            accessToken: document.getElementById('access-token'),
            btnGetToken: document.getElementById('btn-get-token'),
            proxyToggle: document.getElementById('use-proxy-toggle'),
            proxyLabel: document.getElementById('proxy-label'),
            webhookToggle: document.getElementById('use-webhook-toggle'),
            webhookLabel: document.getElementById('webhook-label'),
            orderId: document.getElementById('order-id'),
            webhookUrl: document.getElementById('webhook-url'),
            txAmount: document.getElementById('tx-amount'),
            txCurrency: document.getElementById('tx-currency'),
            txCountry: document.getElementById('tx-country'),
            txId: document.getElementById('tx-id'),
            custName: document.getElementById('cust-name'),
            custId: document.getElementById('cust-id'),
            custIdType: document.getElementById('cust-id-type'),
            custEmail: document.getElementById('cust-email'),
            redirectUrl: document.getElementById('redirect-url'),
            btnCreateTx: document.getElementById('btn-create-tx'),
            paymentLinkContainer: document.getElementById('payment-link-container'),
            paymentLink: document.getElementById('payment-link'),
            paymentStatus: document.getElementById('payment-status'),
            btnCheckStatus: document.getElementById('btn-check-status'),
            btnOpenLink: document.getElementById('btn-open-link'),
            apiLogs: document.getElementById('api-logs'),
            webhookLogs: document.getElementById('webhook-logs'),
            btnClearLogs: document.getElementById('btn-clear-logs'),
            btnClearWebhooks: document.getElementById('btn-clear-webhooks'),
            btnRefreshWebhooks: document.getElementById('btn-refresh-webhooks')
        };

        // Initialization
        function init() {
            // Generate initial order ID
            state.orderId = 'order_' + Date.now();
            el.orderId.value = state.orderId;

            // Load from session storage
            const savedProxy = sessionStorage.getItem('use-proxy-toggle');
            if (savedProxy !== null) el.proxyToggle.checked = savedProxy === 'true';

            const savedWebhook = sessionStorage.getItem('use-webhook-toggle');
            if (savedWebhook !== null) el.webhookToggle.checked = savedWebhook === 'true';

            updateWebhookUI();
            updateProxyUI();

            // Event Listeners
            el.proxyToggle.addEventListener('change', () => {
                updateProxyUI();
                sessionStorage.setItem('use-proxy-toggle', el.proxyToggle.checked);
            });

            el.webhookToggle.addEventListener('change', () => {
                updateWebhookUI();
                sessionStorage.setItem('use-webhook-toggle', el.webhookToggle.checked);
            });

            el.btnGetToken.addEventListener('click', getToken);
            el.btnCreateTx.addEventListener('click', createTransaction);
            el.btnCheckStatus.addEventListener('click', checkStatus);
            el.btnOpenLink.addEventListener('click', () => window.open(el.paymentLink.href, '_blank'));
            el.btnClearLogs.addEventListener('click', () => el.apiLogs.innerHTML = '');
            el.btnClearWebhooks.addEventListener('click', clearWebhooks);
            el.btnRefreshWebhooks.addEventListener('click', fetchWebhooks);

            // Start auto-polling
            state.pollingInterval = setInterval(fetchWebhooks, 5000);
        }

        function updateProxyUI() {
            el.proxyLabel.textContent = el.proxyToggle.checked ? 'Proxy' : 'Direct API';
        }

        function updateWebhookUI() {
            if (el.webhookToggle.checked) {
                el.webhookLabel.textContent = 'N8n Webhooks';
                el.webhookUrl.value = `${CONFIG.N8N_BASE}/${state.orderId}`;
            } else {
                el.webhookLabel.textContent = 'Local Webhooks';
                el.webhookUrl.value = CONFIG.LOCAL_WEBHOOK;
            }
        }

        // API Helpers
        async function apiRequest(method, url, headers = {}, body = null) {
            const useProxy = el.proxyToggle.checked;
            let targetUrl = url;
            let options = { method, headers };

            if (body) {
                if (headers['Content-Type'] === 'application/x-www-form-urlencoded') {
                    options.body = body;
                } else {
                    options.body = JSON.stringify(body);
                }
            }

            if (useProxy) {
                const proxyBody = {
                    url: targetUrl,
                    method: method,
                    headers: headers,
                    body: body
                };
                targetUrl = CONFIG.PROXY_URL;
                options = {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(proxyBody)
                };
            }

            const startTime = new Date().toLocaleTimeString();
            logApi('PENDING', `${method} ${url}`, headers, body);

            try {
                const response = await fetch(targetUrl, options);
                let data = await response.json();

                // Unwrap proxy response
                if (useProxy) {
                    const status = data.status;
                    const realBody = typeof data.body === 'string' ? JSON.parse(data.body) : data.body;
                    logApi(status, `${method} ${url}`, data.headers, realBody);
                    return { status, data: realBody };
                }

                logApi(response.status, `${method} ${url}`, {}, data);
                return { status: response.status, data };
            } catch (error) {
                logApi('ERROR', `${method} ${url}`, {}, { error: error.message });
                return { status: 'ERROR', data: { error: error.message } };
            }
        }

        function logApi(status, title, headers, body) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const statusClass = status >= 200 && status < 300 ? 'status-success' : 'status-failed';

            entry.innerHTML = `
                <div class="log-meta">
                    <span>${new Date().toLocaleTimeString()} | ${title}</span>
                    <span class="status-badge ${statusClass}">${status}</span>
                </div>
                <div><strong>Body:</strong> <pre>${JSON.stringify(body, null, 2)}</pre></div>
                <button class="copy-btn" onclick="copyToClipboard(this)">Copy Entry</button>
            `;
            el.apiLogs.prepend(entry);
        }

        async function getToken() {
            setLoading(el.btnGetToken, true);
            const clientId = el.clientId.value;
            const clientSecret = el.clientSecret.value;
            const auth = btoa(`${clientId}:${clientSecret}`);

            const result = await apiRequest(
                'POST',
                'https://sandbox.smartfastpay.com/oauth2/token',
                {
                    'Authorization': `Basic ${auth}`,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                'grant_type=client_credentials'
            );

            if (result.status === 200) {
                state.token = result.data.data.access_token;
                el.accessToken.value = state.token;
            }
            setLoading(el.btnGetToken, false);
        }

        async function createTransaction() {
            if (!state.token) {
                alert('Please get an access token first!');
                return;
            }

            setLoading(el.btnCreateTx, true);
            const payload = {
                transaction: {
                    id: state.orderId,
                    amount: parseFloat(el.txAmount.value),
                    currency: el.txCurrency.value
                },
                country: el.txCountry.value,
                customer: {
                    name: el.custName.value,
                    id: el.custId.value,
                    id_type: el.custIdType.value,
                    email: el.custEmail.value
                },
                notification_url: el.webhookUrl.value,
                redirect_url: el.redirectUrl.value
            };

            const result = await apiRequest(
                'POST',
                'https://sandbox.smartfastpay.com/v2/transaction/checkout',
                {
                    'Authorization': `Bearer ${state.token}`,
                    'Content-Type': 'application/json'
                },
                payload
            );

            if (result.status === 200 && result.data.data) {
                state.providerTxId = result.data.data.transaction_id;
                el.txId.value = state.providerTxId;
                el.paymentLink.href = result.data.data.url;
                el.paymentLink.textContent = result.data.data.url;
                el.paymentLinkContainer.style.display = 'block';
            } else {
                alert('Failed to create transaction. Check logs.');
            }
            setLoading(el.btnCreateTx, false);
        }

        async function checkStatus() {
            if (!state.providerTxId) return;
            setLoading(el.btnCheckStatus, true);

            const result = await apiRequest(
                'GET',
                `https://sandbox.smartfastpay.com/v2/transaction/${state.providerTxId}`,
                { 'Authorization': `Bearer ${state.token}` }
            );

            if (result.status === 200) {
                el.paymentStatus.textContent = result.data.data.status || 'Unknown';
            }
            setLoading(el.btnCheckStatus, false);
        }

        async function fetchWebhooks() {
            const isN8n = el.webhookToggle.checked;
            const url = isN8n
                ? `${CONFIG.N8N_BASE}/${state.orderId}`
                : CONFIG.LOCAL_POLL;

            const headers = isN8n
                ? { 'Authorization': 'Basic ' + btoa('callbacks-test:callbacks-test123') }
                : {};

            try {
                const response = await fetch(url, { headers });
                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    el.webhookLogs.innerHTML = '';
                    data.reverse().forEach(hook => {
                        const entry = document.createElement('div');
                        entry.className = 'webhook-entry';
                        entry.innerHTML = `
                            <div class="log-meta">
                                <span>${hook.timestamp || new Date().toLocaleTimeString()}</span>
                                <span class="status-badge status-success">${hook.method || 'POST'}</span>
                            </div>
                            <pre>${JSON.stringify(hook.body || hook, null, 2)}</pre>
                        `;
                        el.webhookLogs.appendChild(entry);
                    });
                }
            } catch (e) {
                console.error('Webhook fetch failed', e);
            }
        }

        async function clearWebhooks() {
            if (!el.webhookToggle.checked) {
                await fetch(CONFIG.LOCAL_POLL, { method: 'DELETE' });
            }
            el.webhookLogs.innerHTML = '';
        }

        function setLoading(btn, isLoading) {
            btn.disabled = isLoading;
            if (isLoading) {
                btn.dataset.originalText = btn.innerHTML;
                btn.innerHTML = '<div class="loading-spinner"></div>';
            } else {
                btn.innerHTML = btn.dataset.originalText;
            }
        }

        function copyToClipboard(btn) {
            const pre = btn.parentElement.querySelector('pre');
            navigator.clipboard.writeText(pre.textContent);
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = originalText, 2000);
        }

        window.copyToClipboard = copyToClipboard;
        init();
    </script>
</body>

</html>
