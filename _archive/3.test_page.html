<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFastPay Ecuador USD HPP Testing Console</title>
    <style>
        :root {
            --primary: #00ff88;
            --primary-dark: #00cc6e;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --error: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        h1, h2, h3 {
            margin-bottom: 1rem;
            font-weight: 600;
        }

        h1 {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 0.25rem;
        }

        label span.required {
            color: var(--error);
            margin-left: 2px;
        }

        input, select, textarea {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.875rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        button {
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        button.secondary:hover {
            background-color: rgba(0, 255, 136, 0.1);
        }

        button.danger {
            background-color: transparent;
            border: 1px solid var(--error);
            color: var(--error);
        }

        button.danger:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        .log-container, .webhook-container {
            height: 400px;
            overflow-y: auto;
            background-color: #0c111d;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.75rem;
        }

        .log-entry, .webhook-entry {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #1e293b;
        }

        .log-entry:last-child, .webhook-entry:last-child {
            border-bottom: none;
        }

        .log-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
        }

        .status-badge {
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-pending { background-color: #f59e0b; color: #fff; }
        .status-success { background-color: #22c55e; color: #fff; }
        .status-failed { background-color: #ef4444; color: #fff; }

        pre {
            white-space: pre-wrap;
            word-break: break-all;
            color: #e2e8f0;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0;
            text-decoration: underline;
        }

        .grid-span-2 {
            grid-column: 1 / -1;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            padding: 0.5rem 1rem;
            cursor: pointer;
            color: var(--text-dim);
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .loading-spinner {
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(15, 23, 42, 0.3);
            border-top-color: #0f172a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #payment-link-container {
            margin-top: 1rem;
            padding: 1rem;
            background-color: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--primary);
            border-radius: 6px;
            display: none;
        }

        #payment-link-container a {
            color: var(--primary);
            word-break: break-all;
        }

        /* Toggle Switch */
        .switch-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #334155;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:focus + .slider {
            box-shadow: 0 0 1px var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }
        
        .two-col-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SmartFastPay Testing Console (Ecuador USD HPP)</h1>

        <!-- Credentials -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>API Credentials</h2>
                <div class="switch-container">
                    <label style="margin-bottom: 0;">Use Proxy</label>
                    <label class="switch">
                        <input type="checkbox" id="proxy-switch">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="client-id">Client ID <span class="required">*</span></label>
                <input type="text" id="client-id" value="fd8111f7-6ace-4789-b05a-40a6a36cb0be">
            </div>
            <div class="form-group">
                <label for="client-secret">Client Secret <span class="required">*</span></label>
                <input type="password" id="client-secret" value="nST8TYE78oANwe6dvhMiCQQZfthIoWlG">
            </div>
            <div class="form-group">
                <label for="access-token">Access Token <span class="required">*</span></label>
                <input type="text" id="access-token" placeholder="Generated automatically..." readonly>
            </div>
            
            <button id="btn-get-token" onclick="getAccessToken()">
                <span>Get Access Token</span>
            </button>
        </div>

        <!-- Create Transaction -->
        <div class="card">
            <h2>Create Transaction</h2>
            
            <div class="two-col-grid">
                 <div class="form-group">
                    <label for="txn-id">Transaction ID <span class="required">*</span></label>
                    <input type="text" id="txn-id">
                 </div>
                 <div class="form-group">
                    <label for="txn-amount">Amount (USD) <span class="required">*</span></label>
                    <input type="number" id="txn-amount" value="10.00" step="0.01">
                 </div>
            </div>

            <h3>Customer Config</h3>
            <div class="two-col-grid">
                <div class="form-group">
                    <label for="cust-name">Name</label>
                    <input type="text" id="cust-name" value="Test User">
                </div>
                <div class="form-group">
                    <label for="cust-email">Email</label>
                    <input type="email" id="cust-email" value="test@example.com">
                </div>
                <!-- Document is optional in HPP but nice to have -->
                <div class="form-group">
                    <label for="doc-type">Doc Type</label>
                    <input type="text" id="doc-type" value="CI" placeholder="CI, CPF">
                </div>
                <div class="form-group">
                    <label for="doc-number">Doc Number</label>
                    <input type="text" id="doc-number" value="1710034065" placeholder="Valid Checksum ID">
                </div>
                 <div class="form-group">
                    <label for="cust-id">Customer ID</label>
                    <input type="text" id="cust-id" value="cust_12345">
                </div>
            </div>

            <h3>Payment Config</h3>
             <div class="form-group">
                <label for="payment-method">Payment Method</label>
                <input type="text" id="payment-method" value="bank_transfer" readonly>
            </div>
            
            <button id="btn-create-txn" onclick="createTransaction()">
                <span>Create Transaction</span>
            </button>

            <div id="payment-link-container">
                <p><strong>Payment Link:</strong></p>
                <a href="#" id="payment-link" target="_blank"></a>
            </div>
        </div>

        <!-- Logs & Webhooks -->
        <div class="card grid-span-2">
            <div class="tabs">
                <div class="tab active" data-target="api-logs" onclick="switchTab('api-logs')">API Logs</div>
                <div class="tab" data-target="webhook-logs" onclick="switchTab('webhook-logs')">Webhooks</div>
            </div>
            
            <div id="api-logs" class="log-container">
                <div style="display: flex; justify-content: flex-end; margin-bottom: 0.5rem;">
                    <button class="secondary" onclick="copyAllLogs('api')" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Copy All Logs</button>
                    <button class="danger" onclick="clearLogs('api')" style="margin-left: 0.5rem; padding: 0.25rem 0.5rem; font-size: 0.75rem;">Clear</button>
                </div>
                <div id="api-logs-content"></div>
            </div>
            
            <div id="webhook-logs" class="webhook-container" style="display: none;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                     <div style="font-size: 0.8rem; color: var(--text-dim);">Auto-polling active (5s)</div>
                     <div>
                        <button class="secondary" onclick="fetchWebhooks()" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Refresh Now</button>
                        <button class="secondary" onclick="copyAllLogs('webhook')" style="margin-left: 0.5rem; padding: 0.25rem 0.5rem; font-size: 0.75rem;">Copy All</button>
                        <button class="danger" onclick="clearWebhooks()" style="margin-left: 0.5rem; padding: 0.25rem 0.5rem; font-size: 0.75rem;">Clear Server Logs</button>
                     </div>
                </div>
                <div id="webhook-logs-content"></div>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration & Utils ---
        const PROXY_URL = 'http://localhost:8000/proxy';
        const WEBHOOK_URL = 'http://localhost:8000/webhook';
        const WEBHOOK_API_URL = 'http://localhost:8000/api/webhooks';
        
        function uuidv4() {
          return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
            (+c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> +c / 4).toString(16)
          );
        }

        // Init fields
        document.getElementById('txn-id').value = uuidv4();
        
        // Persistence
        const persistFields = ['client-id', 'client-secret', 'cust-name', 'cust-email', 'doc-type', 'doc-number', 'cust-id'];
        
        function saveState() {
            const state = {};
            persistFields.forEach(id => {
                const el = document.getElementById(id);
                if (el) state[id] = el.value;
            });
            state['use-proxy'] = document.getElementById('proxy-switch').checked;
            state['access-token'] = document.getElementById('access-token').value;
            sessionStorage.setItem('smartfastpay_test_config', JSON.stringify(state));
        }

        function loadState() {
            const saved = sessionStorage.getItem('smartfastpay_test_config');
            if (saved) {
                const state = JSON.parse(saved);
                persistFields.forEach(id => {
                    const el = document.getElementById(id);
                    if (el && state[id] !== undefined) el.value = state[id];
                });
                if(state['use-proxy'] !== undefined) document.getElementById('proxy-switch').checked = state['use-proxy'];
                if(state['access-token']) document.getElementById('access-token').value = state['access-token'];
            }
        }
        
        window.addEventListener('beforeunload', saveState);
        window.addEventListener('load', () => {
             loadState();
             startWebhookPolling();
        });

        // --- Core Logic ---

        async function makeRequest(url, method, headers, body) {
            const useProxy = document.getElementById('proxy-switch').checked;
            
            let finalUrl = url;
            let finalMethod = method;
            let finalHeaders = headers;
            let finalBody = body;

            if (useProxy) {
                finalUrl = PROXY_URL;
                finalMethod = 'POST';
                finalHeaders = { 'Content-Type': 'application/json' };
                finalBody = JSON.stringify({
                    url: url,
                    method: method,
                    headers: headers,
                    body: typeof body === 'string' ? body : JSON.stringify(body)
                });
            }

            logRequest(url, method, headers, body);

            try {
                const response = await fetch(finalUrl, {
                    method: finalMethod,
                    headers: finalHeaders,
                    body: finalBody
                });

                let data;
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    data = await response.json();
                } else {
                    data = await response.text();
                }

                if (useProxy) {
                    // Unwrap proxy response
                    // Expected format: { status, headers, body }
                    if (typeof data.body === 'string') {
                        try {
                            data.body = JSON.parse(data.body);
                        } catch(e) { /* ignore */ }
                    }
                    logResponse(data.status, data.body);
                    return { ok: data.status >= 200 && data.status < 300, data: data.body, status: data.status };
                } else {
                    logResponse(response.status, data);
                    return { ok: response.ok, data: data, status: response.status };
                }

            } catch (error) {
                logResponse('ERROR', error.message);
                throw error;
            }
        }

        async function getAccessToken() {
            const btn = document.getElementById('btn-get-token');
            setLoading(btn, true);
            
            const clientId = document.getElementById('client-id').value;
            const clientSecret = document.getElementById('client-secret').value;
            
            const credentials = btoa(`${clientId}:${clientSecret}`);
            
            try {
                const response = await makeRequest(
                    'https://sandbox.smartfastpay.com/oauth2/token',
                    'POST',
                    {
                        'Authorization': `Basic ${credentials}`,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    'grant_type=client_credentials'
                );

                if (response.ok && response.data.access_token) {
                    document.getElementById('access-token').value = response.data.access_token;
                    saveState(); // Save token immediately
                } else {
                    alert('Failed to get token: ' + JSON.stringify(response.data));
                }
            } catch (e) {
                alert('Error getting token: ' + e.message);
            } finally {
                setLoading(btn, false);
            }
        }

        async function createTransaction() {
            const btn = document.getElementById('btn-create-txn');
            setLoading(btn, true);
            
            const token = document.getElementById('access-token').value;
            if (!token) {
                alert('Please get an access token first.');
                setLoading(btn, false);
                return;
            }

            const payload = {
                customer: {
                    id: document.getElementById('cust-id').value,
                    name: document.getElementById('cust-name').value,
                    email: document.getElementById('cust-email').value,
                    document: {
                        number: document.getElementById('doc-number').value,
                        type: document.getElementById('doc-type').value
                    }
                },
                transaction: {
                    id: document.getElementById('txn-id').value,
                    currency: "USD",
                    amount: parseFloat(document.getElementById('txn-amount').value)
                },
                branch: "TestBranch", // Optional
                country: "ECU", // Ecuador
                notification_url: WEBHOOK_URL,
                // redirect_url: "http://localhost:8000/success", // Optional
                payment_method: [document.getElementById('payment-method').value]
            };

            try {
                // IMPORTANT: The docs shown 'data-raw' with country: BRA. User wants ECU.
                // Currency is USD.
                
                const response = await makeRequest(
                    'https://sandbox.smartfastpay.com/v2/transaction/checkout',
                    'POST',
                    {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    payload
                );

                if (response.ok && response.data.data && response.data.data.url) {
                    const link = response.data.data.url;
                    const container = document.getElementById('payment-link-container');
                    const linkEl = document.getElementById('payment-link');
                    
                    container.style.display = 'block';
                    linkEl.href = link;
                    linkEl.textContent = link;
                    linkEl.click(); // Auto-open? Maybe better to let user click.
                    
                    // Regenerate txn id for next time
                    document.getElementById('txn-id').value = uuidv4();
                } else {
                    alert('Failed to create transaction: ' + JSON.stringify(response.data));
                }
            } catch (e) {
                alert('Error creating transaction: ' + e.message);
            } finally {
                setLoading(btn, false);
            }
        }

        // --- UI Helpers ---

        function setLoading(btn, isLoading) {
            const span = btn.querySelector('span');
            if (isLoading) {
                btn.disabled = true;
                const originalText = span.textContent;
                btn.dataset.originalText = originalText;
                span.innerHTML = '<div class="loading-spinner"></div>';
            } else {
                btn.disabled = false;
                span.textContent = btn.dataset.originalText || span.textContent;
            }
        }

        function switchTab(targetId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.log-container, .webhook-container').forEach(c => c.style.display = 'none');
            
            document.querySelector(`.tab[data-target="${targetId}"]`).classList.add('active');
            document.getElementById(targetId).style.display = 'block';
        }

        // --- Logging System ---

        function logRequest(url, method, headers, body) {
            const container = document.getElementById('api-logs-content');
            const id = 'req-' + Date.now();
            
            let bodyStr = '';
            try {
                 bodyStr = typeof body === 'string' ? body : JSON.stringify(body, null, 2);
            } catch(e) { bodyStr = String(body); }

            const html = `
                <div class="log-entry" id="${id}">
                    <div class="log-meta">
                        <span>${new Date().toLocaleTimeString()} | <strong>${method}</strong> ${url}</span>
                        <span class="status-badge status-pending">PENDING</span>
                    </div>
                    <div><strong>Request Headers:</strong> <pre>${JSON.stringify(headers, null, 2)}</pre></div>
                    <div><strong>Request Body:</strong> <pre>${bodyStr}</pre></div>
                </div>
            `;
            container.insertAdjacentHTML('afterbegin', html);
        }

        function logResponse(status, body) {
            const container = document.getElementById('api-logs-content');
            const entry = container.firstElementChild; // Assuming synchronous order for simplicity in single-threaded JS event loop, mostly true for immediate update
            
            if (entry) {
                const badge = entry.querySelector('.status-badge');
                badge.textContent = status;
                badge.className = `status-badge ${status >= 200 && status < 300 ? 'status-success' : 'status-failed'}`;
                
                let bodyStr = '';
                try {
                    bodyStr = typeof body === 'object' ? JSON.stringify(body, null, 2) : body;
                } catch(e) { bodyStr = String(body); }

                entry.insertAdjacentHTML('beforeend', `
                    <div><strong>Response Body:</strong> <pre>${bodyStr}</pre></div>
                `);
            }
        }
        
        function copyAllLogs(type) {
            const id = type === 'api' ? 'api-logs-content' : 'webhook-logs-content';
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text).then(() => alert('Logs copied!'));
        }
        
        function clearLogs(type) {
             const id = type === 'api' ? 'api-logs-content' : 'webhook-logs-content';
             document.getElementById(id).innerHTML = '';
        }

        // --- Webhook Viewer ---

        let pollingInterval;

        function startWebhookPolling() {
            fetchWebhooks();
            pollingInterval = setInterval(fetchWebhooks, 5000);
        }

        async function fetchWebhooks() {
            try {
                const res = await fetch(WEBHOOK_API_URL);
                if (res.ok) {
                    const data = await res.json();
                    renderWebhooks(data);
                }
            } catch (e) {
                console.error("Webhook polling failed", e);
            }
        }

        function renderWebhooks(webhooks) {
            const container = document.getElementById('webhook-logs-content');
            container.innerHTML = '';
            
            if (webhooks.length === 0) {
                container.innerHTML = '<p style="color: var(--text-dim); text-align: center; margin-top: 2rem;">No webhooks received yet.</p>';
                return;
            }

            webhooks.forEach(wh => {
                const html = `
                    <div class="webhook-entry">
                        <div class="log-meta">
                            <span>${new Date(wh.timestamp).toLocaleString()} | <strong>${wh.method}</strong></span>
                        </div>
                        <div><strong>Headers:</strong> <pre>${JSON.stringify(wh.headers, null, 2)}</pre></div>
                        <div><strong>Body:</strong> <pre>${JSON.stringify(wh.body, null, 2)}</pre></div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }
        
        async function clearWebhooks() {
            try {
                await fetch(WEBHOOK_API_URL, { method: 'DELETE' });
                fetchWebhooks();
            } catch(e) {
                alert('Failed to clear webhooks: ' + e.message);
            }
        }
    </script>
</body>
</html>
