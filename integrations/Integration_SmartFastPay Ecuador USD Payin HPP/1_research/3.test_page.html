<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFastPay Ecuador Testing Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --primary-dark: #00cc6e;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --error: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        h1,
        h2,
        h3 {
            margin-bottom: 1rem;
            font-weight: 600;
        }

        h1 {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 0.25rem;
        }

        input,
        select,
        textarea {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.875rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        button {
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        button.secondary:hover {
            background-color: rgba(0, 255, 136, 0.1);
        }

        button.danger {
            background-color: transparent;
            border: 1px solid var(--error);
            color: var(--error);
        }

        button.danger:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        .log-container,
        .webhook-container {
            height: 400px;
            overflow-y: auto;
            background-color: #0c111d;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.75rem;
        }

        .log-entry,
        .webhook-entry {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #1e293b;
        }

        .log-entry:last-child,
        .webhook-entry:last-child {
            border-bottom: none;
        }

        .log-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
        }

        .status-badge {
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-pending {
            background-color: #f59e0b;
            color: #fff;
        }

        .status-success {
            background-color: #22c55e;
            color: #fff;
        }

        .status-failed {
            background-color: #ef4444;
            color: #fff;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-all;
            color: #e2e8f0;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0;
            text-decoration: underline;
        }

        .grid-span-2 {
            grid-column: 1 / -1;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            padding: 0.5rem 1rem;
            cursor: pointer;
            color: var(--text-dim);
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .loading-spinner {
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(15, 23, 42, 0.3);
            border-top-color: #0f172a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #payment-link-container {
            margin-top: 1rem;
            padding: 1rem;
            background-color: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--primary);
            border-radius: 6px;
            display: none;
        }

        #payment-link-container a {
            color: var(--primary);
            word-break: break-all;
        }

        /* Toggle Switch */
        .switch-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #334155;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--primary);
        }

        input:focus+.slider {
            box-shadow: 0 0 1px var(--primary);
        }

        input:checked+.slider:before {
            transform: translateX(24px);
        }

        .required-star {
            color: var(--error);
            margin-left: 2px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>SmartFastPay Ecuador Testing Console</h1>

        <!-- Left Column: Credentials & Config -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>API Credentials</h2>
                <div class="switch-container">
                    <span style="font-size: 0.8rem; color: var(--text-dim);">Use Proxy</span>
                    <label class="switch">
                        <input type="checkbox" id="use-proxy-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="client-id">Client ID<span class="required-star">*</span></label>
                <input type="text" id="client-id" placeholder="Enter Client ID">
            </div>
            <div class="form-group">
                <label for="client-secret">Client Secret<span class="required-star">*</span></label>
                <input type="password" id="client-secret" placeholder="Enter Client Secret">
            </div>
            <div class="form-group">
                <label for="api-endpoint">API Endpoint<span class="required-star">*</span></label>
                <input type="text" id="api-endpoint" value="https://sandbox.smartfastpay.com">
            </div>
            <div class="form-group">
                <label for="access-token">Access Token</label>
                <input type="text" id="access-token" placeholder="Will be populated after 'Get Token'">
            </div>
            <div class="button-group">
                <button id="btn-get-token">
                    <span>Get Access Token</span>
                </button>
            </div>
        </div>

        <!-- Right Column: Transaction Actions -->
        <div class="card">
            <h2>Create Transaction</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="customer-id">Customer ID<span class="required-star">*</span></label>
                    <input type="text" id="customer-id" placeholder="Internal ID">
                </div>
                <div class="form-group">
                    <label for="customer-name">Full Name<span class="required-star">*</span></label>
                    <input type="text" id="customer-name" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="doc-type">Doc Type<span class="required-star">*</span></label>
                    <select id="doc-type">
                        <option value="CC">CC (Cédula de Ciudadanía)</option>
                        <option value="PA">PA (Pasaporte)</option>
                        <option value="RUC">RUC</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="doc-number">Doc Number (CI)<span class="required-star">*</span></label>
                    <input type="text" id="doc-number" value="1716616812" placeholder="Ecuador CI">
                </div>
                <div class="form-group">
                    <label for="amount">Amount (USD)<span class="required-star">*</span></label>
                    <input type="number" id="amount" value="10.00" step="0.01">
                </div>
                <div class="form-group">
                    <label for="currency">Currency<span class="required-star">*</span></label>
                    <input type="text" id="currency" value="USD" readonly>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label for="notification-url">Notification URL<span class="required-star">*</span></label>
                    <input type="text" id="notification-url" value="http://localhost:8000/webhook">
                </div>
            </div>
            <div class="button-group">
                <button id="btn-create-transaction">
                    <span>Create Transaction</span>
                </button>
                <button id="btn-check-status" class="secondary">
                    <span>Check Status</span>
                </button>
            </div>
            <div id="payment-link-container">
                <p style="font-size: 0.875rem; margin-bottom: 0.5rem; font-weight: 500; color: var(--primary);">Payment
                    Link Created:</p>
                <a href="#" id="payment-link" target="_blank">Open Payment Page</a>
            </div>
        </div>

        <!-- Full Width: Logs & Webhooks -->
        <div class="card grid-span-2">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div class="tabs">
                    <div class="tab active" data-target="api-logs">API Logs</div>
                    <div class="tab" data-target="webhook-logs">Webhooks Received</div>
                </div>
                <div class="button-group" style="margin-top: 0;">
                    <button id="btn-clear-logs" class="danger" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;">
                        <span>Clear All Logs</span>
                    </button>
                    <button id="btn-copy-all" class="secondary" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;">
                        <span>Copy All</span>
                    </button>
                </div>
            </div>

            <div id="api-logs" class="log-container">
                <div style="color: var(--text-dim); text-align: center; margin-top: 2rem;">No logs yet. Perform an
                    action to see activity.</div>
            </div>

            <div id="webhook-logs" class="webhook-container" style="display: none;">
                <div style="color: var(--text-dim); text-align: center; margin-top: 2rem;">No webhooks received yet.
                    Polling active...</div>
            </div>
        </div>
    </div>

    <script>
        // State management
        const state = {
            useProxy: sessionStorage.getItem('use-proxy') === 'true',
            logs: [],
            webhooks: [],
            lastTransactionId: null
        };

        // DOM Elements
        const el = {
            proxyToggle: document.getElementById('use-proxy-toggle'),
            clientId: document.getElementById('client-id'),
            clientSecret: document.getElementById('client-secret'),
            apiEndpoint: document.getElementById('api-endpoint'),
            accessToken: document.getElementById('access-token'),
            btnGetToken: document.getElementById('btn-get-token'),

            customerId: document.getElementById('customer-id'),
            customerName: document.getElementById('customer-name'),
            docType: document.getElementById('doc-type'),
            docNumber: document.getElementById('doc-number'),
            amount: document.getElementById('amount'),
            currency: document.getElementById('currency'),
            notificationUrl: document.getElementById('notification-url'),
            btnCreateTx: document.getElementById('btn-create-transaction'),
            btnCheckStatus: document.getElementById('btn-check-status'),

            paymentLinkContainer: document.getElementById('payment-link-container'),
            paymentLink: document.getElementById('payment-link'),

            apiLogs: document.getElementById('api-logs'),
            webhookLogs: document.getElementById('webhook-logs'),
            tabs: document.querySelectorAll('.tab'),
            btnClearLogs: document.getElementById('btn-clear-logs'),
            btnCopyAll: document.getElementById('btn-copy-all')
        };

        // Initialize from Session Storage
        el.proxyToggle.checked = state.useProxy;
        el.clientId.value = sessionStorage.getItem('client-id') || '';
        el.clientSecret.value = sessionStorage.getItem('client-secret') || '';
        el.customerId.value = sessionStorage.getItem('customer-id') || 'cust_' + Math.floor(Math.random() * 1000000);
        el.customerName.value = sessionStorage.getItem('customer-name') || 'John Doe';
        el.customerId.placeholder = el.customerId.value;

        // Persist inputs
        const persist = (key, val) => sessionStorage.setItem(key, val);
        el.clientId.addEventListener('input', e => persist('client-id', e.target.value));
        el.clientSecret.addEventListener('input', e => persist('client-secret', e.target.value));
        el.customerId.addEventListener('input', e => persist('customer-id', e.target.value));
        el.customerName.addEventListener('input', e => persist('customer-name', e.target.value));
        el.proxyToggle.addEventListener('change', e => {
            state.useProxy = e.target.checked;
            persist('use-proxy', e.target.checked);
        });

        // Tab Switching
        el.tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                el.tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const target = tab.dataset.target;
                if (target === 'api-logs') {
                    el.apiLogs.style.display = 'block';
                    el.webhookLogs.style.display = 'none';
                } else {
                    el.apiLogs.style.display = 'none';
                    el.webhookLogs.style.display = 'block';
                }
            });
        });

        // Logging Helper
        function addLog(method, url, status, request, response) {
            const entry = {
                timestamp: new Date().toISOString(),
                method,
                url,
                status,
                request,
                response
            };
            state.logs.unshift(entry);
            renderLogs();
        }

        function renderLogs() {
            if (state.logs.length === 0) {
                el.apiLogs.innerHTML = '<div style="color: var(--text-dim); text-align: center; margin-top: 2rem;">No logs yet.</div>';
                return;
            }
            el.apiLogs.innerHTML = state.logs.map((log, index) => `
                <div class="log-entry">
                    <div class="log-meta">
                        <span>${log.timestamp.split('T')[1].split('.')[0]} | ${log.method} ${log.url}</span>
                        <span class="status-badge ${log.status >= 200 && log.status < 300 ? 'status-success' : 'status-failed'}">${log.status}</span>
                    </div>
                    <div style="margin-top: 0.5rem;">
                        <strong>Request Body:</strong>
                        <pre>${JSON.stringify(log.request, null, 2)}</pre>
                    </div>
                    <div style="margin-top: 0.5rem;">
                        <strong>Response Body:</strong>
                        <pre>${typeof log.response === 'string' ? log.response : JSON.stringify(log.response, null, 2)}</pre>
                    </div>
                    <button class="copy-btn" onclick="copyLogEntry(${index})">Copy Entry</button>
                </div>
            `).join('');
        }

        window.copyLogEntry = (index) => {
            const log = state.logs[index];
            navigator.clipboard.writeText(JSON.stringify(log, null, 2));
            alert('Log entry copied to clipboard');
        };

        // Webhook Polling
        async function pollWebhooks() {
            try {
                const response = await fetch('http://localhost:8000/api/webhooks');
                if (response.ok) {
                    const data = await response.json();
                    if (JSON.stringify(data) !== JSON.stringify(state.webhooks)) {
                        state.webhooks = data;
                        renderWebhooks();
                    }
                }
            } catch (err) {
                console.error('Webhook polling failed:', err);
            }
        }
        setInterval(pollWebhooks, 5000);

        function renderWebhooks() {
            if (state.webhooks.length === 0) {
                el.webhookLogs.innerHTML = '<div style="color: var(--text-dim); text-align: center; margin-top: 2rem;">No webhooks received yet.</div>';
                return;
            }
            // Sort by timestamp descending
            const sorted = [...state.webhooks].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            el.webhookLogs.innerHTML = sorted.map((wh, index) => `
                <div class="webhook-entry">
                    <div class="log-meta">
                        <span>${new Date(wh.timestamp).toLocaleTimeString()} | ${wh.method}</span>
                        <span class="status-badge status-success">Received</span>
                    </div>
                    <div style="margin-top: 0.5rem;">
                        <strong>Headers:</strong>
                        <pre>${JSON.stringify(wh.headers, null, 2)}</pre>
                    </div>
                    <div style="margin-top: 0.5rem;">
                        <strong>Body:</strong>
                        <pre>${JSON.stringify(wh.body, null, 2)}</pre>
                    </div>
                    <button class="copy-btn" onclick="copyWebhook(${index})">Copy Webhook</button>
                </div>
            `).join('');
        }

        window.copyWebhook = (index) => {
            const wh = state.webhooks[index];
            navigator.clipboard.writeText(JSON.stringify(wh, null, 2));
            alert('Webhook copied to clipboard');
        };

        // Clear Logs
        el.btnClearLogs.addEventListener('click', async () => {
            state.logs = [];
            renderLogs();
            try {
                await fetch('http://localhost:8000/api/webhooks', { method: 'DELETE' });
                state.webhooks = [];
                renderWebhooks();
            } catch (err) {
                console.error('failed to clear webhooks', err);
            }
        });

        // Request Helper
        async function makeRequest(url, method, headers, body) {
            const targetUrl = url;
            const targetHeaders = { ...headers };
            let finalUrl = targetUrl;
            let finalOptions = { method, headers: targetHeaders };

            if (body) {
                finalOptions.body = JSON.stringify(body);
            }

            if (state.useProxy) {
                finalUrl = 'http://localhost:8000/proxy';
                finalOptions = {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: targetUrl,
                        method,
                        headers: targetHeaders,
                        body: body || null
                    })
                };
            }

            console.log(`Sending to: ${finalUrl}`, finalOptions);
            const response = await fetch(finalUrl, finalOptions);
            let responseData;

            if (state.useProxy) {
                // The proxy returns {status, headers, body}
                const proxyData = await response.json();
                responseData = {
                    status: proxyData.status,
                    headers: proxyData.headers,
                    body: typeof proxyData.body === 'string' ? (function () {
                        try { return JSON.parse(proxyData.body); } catch (e) { return proxyData.body; }
                    })() : proxyData.body
                };
            } else {
                responseData = {
                    status: response.status,
                    headers: Object.fromEntries(response.headers.entries()),
                    body: await response.json().catch(() => response.text())
                };
            }

            addLog(method, targetUrl, responseData.status, body || {}, responseData.body);
            return responseData;
        }

        // Actions
        el.btnGetToken.addEventListener('click', async () => {
            const btn = el.btnGetToken;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loading-spinner"></div><span>Requesting...</span>';
            btn.disabled = true;

            try {
                const basicAuth = btoa(`${el.clientId.value}:${el.clientSecret.value}`);
                const res = await makeRequest(
                    `${el.apiEndpoint.value}/oauth2/token`,
                    'POST',
                    {
                        'Authorization': `Basic ${basicAuth}`,
                        'Content-Type': 'application/json'
                    },
                    { grant_type: 'client_credentials' }
                );

                if (res.status === 200 && res.body.data && res.body.data.access_token) {
                    el.accessToken.value = res.body.data.access_token;
                    persist('access-token', res.body.data.access_token);
                } else if (res.status === 200 && res.body.access_token) {
                    el.accessToken.value = res.body.access_token;
                    persist('access-token', res.body.access_token);
                }
            } catch (err) {
                alert('Token request failed: ' + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        el.btnCreateTx.addEventListener('click', async () => {
            const btn = el.btnCreateTx;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loading-spinner"></div><span>Creating...</span>';
            btn.disabled = true;

            try {
                const payload = {
                    customer: {
                        id: el.customerId.value,
                        name: el.customerName.value,
                        document: {
                            number: el.docNumber.value,
                            type: el.docType.value
                        }
                    },
                    transaction: {
                        id: 'TX_' + Date.now(),
                        currency: el.currency.value,
                        amount: parseFloat(el.amount.value)
                    },
                    country: 'ECU',
                    payment_method: ['bank_transfer'],
                    notification_url: el.notificationUrl.value
                };

                const res = await makeRequest(
                    `${el.apiEndpoint.value}/v2/transaction/checkout`,
                    'POST',
                    {
                        'Authorization': `Bearer ${el.accessToken.value}`,
                        'Content-Type': 'application/json'
                    },
                    payload
                );

                if (res.status === 200 && res.body.data && res.body.data.url) {
                    el.paymentLink.href = res.body.data.url;
                    el.paymentLinkContainer.style.display = 'block';
                    state.lastTransactionId = res.body.data.transaction_id;
                    persist('last-tx-id', state.lastTransactionId);
                }
            } catch (err) {
                alert('Transaction creation failed: ' + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        el.btnCheckStatus.addEventListener('click', async () => {
            const txId = state.lastTransactionId || sessionStorage.getItem('last-tx-id');
            if (!txId) {
                alert('No transaction ID found. Create a transaction first.');
                return;
            }

            const btn = el.btnCheckStatus;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loading-spinner"></div><span>Checking...</span>';
            btn.disabled = true;

            try {
                await makeRequest(
                    `${el.apiEndpoint.value}/payment/${txId}`,
                    'GET',
                    { 'Authorization': `Bearer ${el.accessToken.value}` },
                    null
                );
            } catch (err) {
                alert('Status check failed: ' + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        el.btnCopyAll.addEventListener('click', () => {
            const fullContent = {
                logs: state.logs,
                webhooks: state.webhooks
            };
            navigator.clipboard.writeText(JSON.stringify(fullContent, null, 2));
            alert('Full log and webhooks copied to clipboard');
        });
    </script>
</body>

</html>
