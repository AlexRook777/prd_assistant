openapi: 3.1.0
info:
  title: SmartFastPay Ecuador - USD - Bank Transfer Payin HPP
  version: 1.0.0
  description: Machine-executable contract for the SmartFastPay Ecuador USD Bank Transfer Payin HPP integration.
  x-4bill-metadata:
    provider: SmartFastPay
    region: ECU
    type: HPP
    rulebook: Acquiring Form

servers:
  - url: https://sandbox.smartfastpay.com
    description: Sandbox Environment
  - url: https://api.smartfastpay.com
    description: Production Environment

paths:
  /oauth2/token:
    post:
      summary: Generate OAuth 2.0 Access Token
      operationId: generateToken
      tags:
        - Authorization
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  default: client_credentials
              required:
                - grant_type
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized

  /v2/transaction/checkout:
    post:
      summary: Create PayIn Transaction (HPP)
      operationId: createCheckout
      tags:
        - Transaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'

  /v2/transaction/{id}:
    get:
      summary: Check Transaction Status
      operationId: getStatus
      tags:
        - Transaction
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The provider transaction ID (UUID)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    basicAuth:
      type: http
      scheme: basic

  schemas:
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
          default: 3600

    CheckoutRequest:
      type: object
      required:
        - customer
        - transaction
        - country
        - payment_method
      properties:
        customer:
          type: object
          required:
            - id
            - document
          properties:
            id:
              type: string
              x-betterbro-mapping:
                field: "external_customer_id"
                required: true
            name:
              type: string
              x-betterbro-mapping:
                field: "fields.first_name"
                required: false
                note: "Provider uses single name. Split may be required for BetterBro."
            email:
              type: string
              format: email
              x-betterbro-mapping:
                field: "fields.email"
                required: false
            document:
              type: object
              required:
                - number
                - type
              properties:
                number:
                  type: string
                  pattern: "^[0-9]{10}$"
                  x-betterbro-mapping:
                    field: "fields.tax_id"
                    required: true
                type:
                  type: string
                  enum: [CC, RUC, PA]
                  x-betterbro-mapping:
                    field: "fields.tax_id_type"
                    required: true
                    enum_map:
                      CC: CI
                      RUC: RUC
                      PA: PASS
        transaction:
          type: object
          required:
            - id
            - currency
            - amount
          properties:
            id:
              type: string
              x-betterbro-mapping:
                field: "external_transaction_id"
                required: true
            currency:
              type: string
              enum: [USD]
              x-betterbro-mapping:
                field: "amount_currency"
                required: true
            amount:
              type: number
              format: decimal
              x-betterbro-mapping:
                field: "amount"
                required: true
                transformation: "*100"
                type: integer
        country:
          type: string
          enum: [ECU]
        payment_method:
          type: array
          items:
            type: string
            enum: [bank_transfer]
        notification_url:
          type: string
          format: uri
          x-betterbro-mapping:
            field: "point.callback_url"
            required: false
        redirect_url:
          type: string
          format: uri
          x-betterbro-mapping:
            field: "point.return_url"
            required: false

    CheckoutResponse:
      type: object
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          properties:
            url:
              type: string
              format: uri
            transaction_id:
              type: string
              format: uuid
            expires_at:
              type: string

    StatusResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            transaction_id:
              type: string
            status:
              type: string
              enum: [open, paid, cancelled, expired, failed]
              x-betterbro-status-codes:
                open: 10
                paid: 1
                cancelled: 3
                expired: 5
                failed: 2
            amount:
              type: number
            currency:
              type: string

webhooks:
  notification:
    post:
      summary: Payment Notification Webhook
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Merchant order ID (transaction.id)
                transaction_id:
                  type: string
                  description: Provider transaction ID
                status:
                  type: string
                  enum: [paid, failed, cancelled]
                  x-betterbro-status-codes:
                    paid: 1
                    failed: 2
                    cancelled: 3
                amount:
                  type: number
      responses:
        '200':
          description: Webhook received and processed successfully
